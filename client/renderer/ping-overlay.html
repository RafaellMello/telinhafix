<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>TelinhaFix - apontar</title>
<!-- Camada transparente por cima do monitor que a pessoa esta transmitindo:
     mostra a seta de quem apontou (Alt + clique na transmissao). Nao recebe
     clique (main.js) e fica fora da propria captura de tela. -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Segoe UI", Arial, sans-serif; }
  .ping { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; animation: drop 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.3) both, bob 0.9s 0.35s ease-in-out 3, fade 0.4s 3.2s ease-in forwards; }
  .ping .name { padding: 4px 12px; border-radius: 999px; color: #fff; font-weight: 800; font-size: 18px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55); }
  .ping svg { width: 54px; height: 64px; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6)); }
  @keyframes drop { from { opacity: 0; transform: translate(-50%, calc(-100% - 60px)); } to { opacity: 1; transform: translate(-50%, -100%); } }
  @keyframes bob { 50% { transform: translate(-50%, calc(-100% - 12px)); } }
  @keyframes fade { to { opacity: 0; } }
</style>
</head>
<body>
<script>
  // chamado pelo main.js com { x, y (0-1, posicao no monitor), name, color }
  window.showPing = (ping) => {
    const el = document.createElement('div');
    el.className = 'ping';
    el.style.left = `${Math.max(0, Math.min(1, ping.x)) * 100}%`;
    el.style.top = `${Math.max(0, Math.min(1, ping.y)) * 100}%`;
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = String(ping.name || '');
    name.style.background = ping.color;
    el.appendChild(name);
    el.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 54 64"><path d="M17 0h20v34h17L27 64 0 34h17Z" fill="${ping.color}" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>`);
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3800);
  };
</script>
</body>
</html>
