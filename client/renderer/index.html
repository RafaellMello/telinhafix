<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>ScreenBunny</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login-screen" class="screen">
    <div id="members-left" class="members-col"></div>

    <div class="login-box">
      <div class="brand">
        <img src="assets/logo.png" alt="ScreenBunny" />
        <h1>Screen<span>Bunny</span></h1>
      </div>
      <p class="subtitle">fiz essa parada aqui pra gente streamar tela, sucumba lula e janja</p>
      <hr class="divider" />

      <label>Endereço do servidor</label>
      <input id="server-url" type="text" placeholder="https://seu-servidor.onrender.com" value="https://screenbunny.onrender.com" />

      <label>Senha do servidor (se houver)</label>
      <input id="server-password" type="password" placeholder="opcional" />

      <label>Seu nome</label>
      <input id="display-name" type="text" />

      <label>Código da sala</label>
      <input id="room-id" type="text" placeholder="Ex: turma-do-rafael" value="latadelixo" />

      <button id="btn-join">Entrar</button>
      <p id="login-error" class="error"></p>
      <p class="credit">developed by: <a href="#" id="credit-link">bunny</a></p>
    </div>

    <div id="members-right" class="members-col"></div>
  </div>

  <div id="room-screen" class="screen hidden">
    <div class="topbar">
      <div>
        Sala: <strong id="room-label"></strong>
      </div>
      <div class="actions">
        <button id="btn-share">Compartilhar tela</button>
        <button id="btn-toggle-camera" class="hidden">Ativar câmera</button>
        <button id="btn-stop-share" class="hidden">Parar compartilhamento</button>
        <button id="btn-leave" class="danger">Sair</button>
      </div>
    </div>

    <div class="body">
      <aside id="participants">
        <h3>Participantes</h3>
        <ul id="participants-list"></ul>
      </aside>

      <main id="video-grid"></main>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
