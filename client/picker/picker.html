<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Escolha o que compartilhar</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('../renderer/assets/fonts/Inter-Variable.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('../renderer/assets/fonts/Poppins-400.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('../renderer/assets/fonts/Poppins-800.woff2') format('woff2');
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 100 800;
      font-display: swap;
      src: url('../renderer/assets/fonts/JetBrainsMono-Variable.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Anton';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('../renderer/assets/fonts/Anton-400.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 200 1000;
      font-display: swap;
      src: url('../renderer/assets/fonts/Nunito-Variable.woff2') format('woff2');
    }
    :root {
      --bg: #060607;
      --bg-elevated: #131315;
      --red: #e2231a;
      --red-bright: #ff3b2f;
      --border: rgba(226, 35, 26, 0.35);
      --font-ui: 'Inter', 'Segoe UI', Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    .hidden { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: #f2f0ec;
      font-family: var(--font-ui);
      padding: 18px 20px;
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--red-bright);
      text-align: center;
    }
    h2 {
      margin: 14px 0 8px 0;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #9a9499;
    }

    /* Abas Telas / Janelas */
    .tabs { display: flex; gap: 8px; justify-content: center; margin: 12px 0; }
    .tab {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: #cfcfcf;
      padding: 6px 16px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    .tab.active { background: var(--red); border-color: var(--red); color: #fff; }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      max-height: 240px;
      overflow-y: auto;
      padding: 4px;
    }
    .option {
      background: var(--bg-elevated);
      border: 2px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
      padding: 0;
      transition: border-color 0.15s, transform 0.1s;
      text-align: left;
    }
    .option:hover { border-color: var(--red); transform: scale(1.02); }
    .option.selected { border-color: var(--red-bright); box-shadow: 0 0 0 2px rgba(255,59,47,0.35); }
    .option img {
      width: 100%;
      height: 96px;
      object-fit: cover;
      display: block;
      background: #000;
    }
    .option .name {
      padding: 6px 8px;
      font-size: 11.5px;
      color: #cfcfcf;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .quality-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .quality-btn {
      background: var(--bg-elevated);
      border: 2px solid var(--border);
      color: #cfcfcf;
      padding: 8px 14px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .quality-btn.selected { border-color: var(--red-bright); background: var(--red); color: #fff; }

    .audio-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; align-items: center; }
    .audio-btn {
      background: var(--bg-elevated);
      border: 2px solid var(--border);
      color: #cfcfcf;
      padding: 8px 14px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .audio-btn.selected { border-color: var(--red-bright); background: var(--red); color: #fff; }

    #app-select {
      background: var(--bg-elevated);
      border: 2px solid var(--border);
      color: #f2f0ec;
      padding: 7px 10px;
      border-radius: 3px;
      font-size: 12px;
      max-width: 260px;
    }

    .footer { display: flex; justify-content: center; margin-top: 18px; }
    #btn-confirm {
      background: linear-gradient(180deg, var(--red-bright), var(--red));
      border: none;
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-size: 13px;
      padding: 10px 28px;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(226, 35, 26, 0.35);
    }
    #btn-confirm:disabled { opacity: 0.4; cursor: default; }
  </style>
  <script>
    // Aplica o mesmo tema (fonte/cor) escolhido na janela principal, salvo
    // no localStorage - as duas janelas compartilham a mesma origem file://.
    (function applyStoredTheme() {
      const FONT_STACKS = {
        inter: "'Inter', 'Segoe UI', Arial, sans-serif",
        poppins: "'Poppins', 'Segoe UI', Arial, sans-serif",
        jetbrains: "'JetBrains Mono', Consolas, monospace",
        anton: "'Anton', 'Segoe UI', Arial, sans-serif",
        nunito: "'Nunito', 'Segoe UI', Arial, sans-serif",
      };
      function brighten(hex) {
        const r = parseInt(hex.slice(1, 3), 16) / 255;
        const g = parseInt(hex.slice(3, 5), 16) / 255;
        const b = parseInt(hex.slice(5, 7), 16) / 255;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        let h = 0; let s = 0; const l = (max + min) / 2;
        if (max !== min) {
          const d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
          else if (max === g) h = (b - r) / d + 2;
          else h = (r - g) / d + 4;
          h /= 6;
        }
        const s2 = Math.min(1, s + 0.1);
        const l2 = Math.min(0.72, l + 0.15) / 1;
        const hue2rgb = (p, q, t) => {
          let tt = t;
          if (tt < 0) tt += 1;
          if (tt > 1) tt -= 1;
          if (tt < 1 / 6) return p + (q - p) * 6 * tt;
          if (tt < 1 / 2) return q;
          if (tt < 2 / 3) return p + (q - p) * (2 / 3 - tt) * 6;
          return p;
        };
        const q = l2 < 0.5 ? l2 * (1 + s2) : l2 + s2 - l2 * s2;
        const p = 2 * l2 - q;
        const rr = hue2rgb(p, q, h + 1 / 3);
        const gg = hue2rgb(p, q, h);
        const bb = hue2rgb(p, q, h - 1 / 3);
        const toHex = (x) => Math.round(x * 255).toString(16).padStart(2, '0');
        return `#${toHex(rr)}${toHex(gg)}${toHex(bb)}`;
      }
      try {
        const saved = JSON.parse(localStorage.getItem('telinhafix-theme'));
        if (!saved) return;
        const root = document.documentElement.style;
        if (saved.font) root.setProperty('--font-ui', FONT_STACKS[saved.font] || FONT_STACKS.inter);
        if (saved.color) {
          root.setProperty('--red', saved.color);
          root.setProperty('--border', saved.color + '59');
          root.setProperty('--red-bright', brighten(saved.color));
        }
      } catch (err) {
        // sem tema salvo ou localStorage indisponivel - fica no padrao.
      }
    })();
  </script>
</head>
<body>
  <h1>O que voce quer compartilhar?</h1>

  <div class="tabs">
    <div class="tab active" data-type="screen">Tela inteira</div>
    <div class="tab" data-type="window">Janela de um programa</div>
  </div>

  <div id="grid"></div>

  <h2>Resolucao</h2>
  <div class="quality-row" id="resolution-row">
    <div class="quality-btn" data-res="720p">720p</div>
    <div class="quality-btn selected" data-res="1080p">1080p</div>
    <div class="quality-btn" data-res="1440p">1440p (2K)</div>
    <div class="quality-btn" data-res="2160p">4K</div>
  </div>

  <h2>Taxa de quadros</h2>
  <div class="quality-row" id="fps-row">
    <div class="quality-btn selected" data-fps="30">30fps</div>
    <div class="quality-btn" data-fps="60">60fps</div>
    <div class="quality-btn" data-fps="120">120fps</div>
  </div>

  <h2>Audio da transmissao</h2>
  <div class="audio-row">
    <div class="audio-btn selected" data-audio="exclude">Sistema, sem o Discord</div>
    <div class="audio-btn" data-audio="system">Sistema todo</div>
    <div class="audio-btn" data-audio="include">So um programa</div>
    <select id="app-select" class="hidden"></select>
  </div>

  <div class="footer">
    <button id="btn-confirm" disabled>Compartilhar</button>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const tabs = document.querySelectorAll('.tab');
    const resolutionBtns = document.querySelectorAll('#resolution-row .quality-btn');
    const fpsBtns = document.querySelectorAll('#fps-row .quality-btn');
    const confirmBtn = document.getElementById('btn-confirm');

    let allSources = [];
    let currentType = 'screen';
    let selectedSourceId = null;
    let selectedResolution = '1080p';
    let selectedFps = '30';

    function selectedQualityKey() {
      return selectedResolution + selectedFps;
    }

    function render() {
      grid.innerHTML = '';
      const filtered = allSources.filter((s) => s.type === currentType);
      filtered.forEach((s) => {
        const btn = document.createElement('button');
        btn.className = 'option' + (s.id === selectedSourceId ? ' selected' : '');

        const img = document.createElement('img');
        img.src = s.thumbnail;

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = s.name || (currentType === 'screen' ? 'Tela' : 'Janela');

        btn.appendChild(img);
        btn.appendChild(name);
        btn.addEventListener('click', () => {
          selectedSourceId = s.id;
          confirmBtn.disabled = false;
          render();
        });
        grid.appendChild(btn);
      });
    }

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        currentType = tab.dataset.type;
        selectedSourceId = null;
        confirmBtn.disabled = true;
        render();
      });
    });

    resolutionBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        resolutionBtns.forEach((b) => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedResolution = btn.dataset.res;
      });
    });

    fpsBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        fpsBtns.forEach((b) => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedFps = btn.dataset.fps;
      });
    });

    const audioBtns = document.querySelectorAll('.audio-btn');
    const appSelect = document.getElementById('app-select');
    let selectedAudioMode = 'exclude';
    let appsLoaded = false;

    async function loadAppsIfNeeded() {
      if (appsLoaded) return;
      appsLoaded = true;
      const apps = await window.picker.listApps();
      appSelect.innerHTML = '';
      apps.forEach((a) => {
        const opt = document.createElement('option');
        opt.value = a.name;
        opt.textContent = a.title;
        appSelect.appendChild(opt);
      });
      if (apps.length === 0) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'Nenhum programa com janela aberta';
        appSelect.appendChild(opt);
      }
    }

    audioBtns.forEach((btn) => {
      btn.addEventListener('click', async () => {
        audioBtns.forEach((b) => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedAudioMode = btn.dataset.audio;
        if (selectedAudioMode === 'include') {
          appSelect.classList.remove('hidden');
          await loadAppsIfNeeded();
        } else {
          appSelect.classList.add('hidden');
        }
      });
    });

    confirmBtn.addEventListener('click', () => {
      if (!selectedSourceId) return;
      const audioTarget = selectedAudioMode === 'include' ? appSelect.value : 'Discord';
      window.picker.choose(selectedSourceId, selectedQualityKey(), selectedAudioMode, audioTarget);
    });

    window.picker.onSources((sources) => {
      allSources = sources;
      render();
    });
  </script>
</body>
</html>
